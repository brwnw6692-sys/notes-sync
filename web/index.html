<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>notes-sync</title>
<link rel="stylesheet" href="vendor/leaflet/leaflet.min.css">
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #0b0f14; font-family: system-ui, sans-serif; color: #e6e6e6; }
  #map { position: absolute; inset: 0; background: #0b0f14; }
  .basemap-dark { filter: invert(1) hue-rotate(180deg) brightness(.95) contrast(.9) saturate(.7); }
  #panel { position: absolute; z-index: 1000; top: 12px; left: 12px; right: 12px;
           max-width: 420px; background: rgba(14,20,28,.92); border: 1px solid #22303c;
           border-radius: 12px; padding: 12px 14px; backdrop-filter: blur(4px); }
  #panel h1 { font-size: 15px; font-weight: 500; margin: 0 0 8px; letter-spacing: .3px; }
  .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  input[type=password] { flex: 1; background: #0b0f14; border: 1px solid #2a3b49; color: #e6e6e6;
                         border-radius: 8px; padding: 7px 9px; font-size: 14px; }
  button { background: #1d6fa5; border: 0; color: #fff; border-radius: 8px; padding: 7px 12px;
           font-size: 14px; cursor: pointer; }
  button.secondary { background: #22303c; }
  #status { margin-top: 8px; font-size: 12px; color: #9fb3c2; line-height: 1.5; }
  .legend { position: absolute; z-index: 1000; bottom: 14px; left: 12px; background: rgba(14,20,28,.9);
            border: 1px solid #22303c; border-radius: 10px; padding: 8px 10px; font-size: 12px; }
  .legend .bar { height: 8px; width: 160px; border-radius: 4px;
                 background: linear-gradient(90deg,#2a6fb0,#d8b12f,#d85a30,#c22e2e); margin: 4px 0; }
  .legend .ends { display: flex; justify-content: space-between; color: #9fb3c2; }
  .legend .blind { display: inline-block; width: 11px; height: 11px; border: 2px dashed #c22e2e;
                   border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
  .legend .frame { display: inline-block; width: 11px; height: 11px; border: 1.5px solid #39b0b8;
                   border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
</style>
</head>
<body>
<div id="map"></div>
<div id="panel">
  <h1>Middle East activity</h1>
  <div class="row">
    <input id="pass" type="password" placeholder="passphrase" autocomplete="off">
    <button id="go">Decrypt</button>
    <button id="demo" class="secondary">Demo</button>
  </div>
  <div id="status">Enter the passphrase to load live data, or press Demo to preview.</div>
</div>
<div class="legend">
  <div>Where something is happening</div>
  <div class="bar"></div>
  <div class="ends"><span>quiet</span><span>intense</span></div>
  <div style="margin-top:7px"><span class="frame"></span>area we listen to</div>
  <label style="display:flex;gap:6px;align-items:center;margin-top:6px;cursor:pointer">
    <input id="toggleBorders" type="checkbox" checked> <span>provinces &amp; borders</span>
  </label>
  <label style="display:flex;gap:6px;align-items:center;margin-top:4px;cursor:pointer">
    <input id="togglePeoples" type="checkbox"> <span>peoples (ethnicity &amp; sect)</span>
  </label>
  <label style="display:flex;gap:6px;align-items:center;margin-top:4px;cursor:pointer">
    <input id="toggleBlind" type="checkbox"> <span><span class="blind"></span>show gaps (unwatched)</span>
  </label>
</div>

<script src="vendor/leaflet/leaflet.min.js"></script>
<script src="app.js?v=5"></script>
</body>
</html>
