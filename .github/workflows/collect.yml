name: collect

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

# Never let two runs overwrite each other's data branch.
concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Fetch existing data branch (if any)
        run: |
          git fetch origin data --depth=1 || true
          rm -rf data_work && mkdir data_work
          if git show-ref --quiet refs/remotes/origin/data; then
            git --work-tree=data_work checkout origin/data -- . || true
          fi

      - name: Run collection
        env:
          DATA_KEY: ${{ secrets.DATA_KEY }}
        run: python -m collector.live data_work

      - name: Publish encrypted data branch
        run: |
          cd data_work
          git init -q
          git config user.name "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git checkout -q -b data
          git add -A
          git commit -q -m "data: scheduled run" || { echo "nothing to commit"; exit 0; }
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" data
